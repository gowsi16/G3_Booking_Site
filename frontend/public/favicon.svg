<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="trailerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="cabGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="windowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BAE6FD" />
      <stop offset="100%" stop-color="#7DD3FC" />
    </linearGradient>
  </defs>

  <!-- Modern App Icon Rounded Background -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>
  
  <!-- Ground Track Line -->
  <path d="M6 50H58" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Cargo Trailer -->
  <rect x="7" y="15" width="31" height="27" rx="3.5" fill="url(#trailerGrad)"/>
  <!-- Trailer Ribs / Details -->
  <path d="M14 18v21M21 18v21M28 18v21" stroke="#B45309" stroke-width="1.75" stroke-linecap="round" opacity="0.6"/>

  <!-- Cabin Connector -->
  <rect x="36" y="32" width="6" height="10" fill="#475569"/>

  <!-- Lorry Cab -->
  <path d="M39 23h7.5c1.4 0 2.7.7 3.5 1.8l5 6.7c.6.8.9 1.8.9 2.8V42H39V23z" fill="url(#cabGrad)"/>

  <!-- Cab Windshield & Window -->
  <path d="M41 26h5.2c.8 0 1.6.4 2.1 1.1l3.5 4.7c.3.4.4.9.4 1.4v.8H41V26z" fill="url(#windowGrad)"/>

  <!-- Headlight -->
  <rect x="53.5" y="37" width="2.8" height="3" rx="1.2" fill="#FDE047"/>

  <!-- Rear Wheel 1 -->
  <circle cx="15" cy="43.5" r="5.5" fill="#020617" stroke="#94A3B8" stroke-width="2"/>
  <circle cx="15" cy="43.5" r="2.2" fill="#E2E8F0"/>

  <!-- Rear Wheel 2 -->
  <circle cx="27" cy="43.5" r="5.5" fill="#020617" stroke="#94A3B8" stroke-width="2"/>
  <circle cx="27" cy="43.5" r="2.2" fill="#E2E8F0"/>

  <!-- Front Wheel -->
  <circle cx="48" cy="43.5" r="5.5" fill="#020617" stroke="#94A3B8" stroke-width="2"/>
  <circle cx="48" cy="43.5" r="2.2" fill="#E2E8F0"/>
</svg>